name: Ruby

on:
  push:
    branches: [ "master" ]
    paths:
      - "./ruby/**" # Only trigger for changes in this directory
  pull_request:
    branches: [ "master" ]
    paths:
      - "./ruby/**" # Only trigger for changes in this directory

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby-version: ['3.2', '3.3']

    steps:
    - uses: actions/checkout@v4
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby-version }}
        working-directory: ruby
        bundler-cache: true
    - name: Run tests
      run: cd ruby && bundle exec rake
