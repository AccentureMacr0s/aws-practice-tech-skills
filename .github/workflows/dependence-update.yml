name: CI/CD with Docker and Ruby

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ruby-tests:
    runs-on: ubuntu-latest

    steps:
    # Шаг 1: Клонирование репозитория
    - name: Checkout repository
      uses: actions/checkout@v3

    # Шаг 2: Сборка Docker-образа
    - name: Build Docker Image
      run: docker build -t my-docker-image .

    # Шаг 3: Запуск Ruby-тестов в Docker
    - name: Run Ruby Tests in Docker
      run: |
        docker run --name ruby-tests-container my-docker-image \
        bash -c "bundle install && bundle exec rspec"

    # Шаг 4: Удаление контейнера
    - name: Cleanup Docker Container
      if: always()
      run: docker rm -f ruby-tests-container
